{% extends 'base.html' %}

{% block title %}{{ product.name }}{% endblock %}

{% block content %}
<div class="row g-5 align-items-center">
  <div class="col-lg-6">
    <img src="{{ product.image_url }}" class="img-fluid rounded-4 shadow" alt="{{ product.name }}" style="width: 100%; height: 520px; object-fit: cover;">
  </div>
  <div class="col-lg-6">
    <span class="badge bg-light text-dark mb-3">{{ product.category.name }}</span>
    <h1 class="display-6 fw-bold">{{ product.name }}</h1>
    <p class="fs-4 text-primary">${{ '%.2f' % product.price }}</p>
    <p class="text-muted">{{ product.description }}</p>
    <div class="d-flex align-items-center gap-3 mb-3">
      <span class="badge rounded-pill bg-success-subtle text-success-emphasis">{{ product.stock }} in stock</span>
    </div>
    <form action="{{ url_for('main.add_to_cart', product_id=product.id) }}" method="post">
      <button type="submit" class="btn btn-primary btn-lg">Add to cart</button>
    </form>
    <a href="{{ url_for('main.home') }}" class="btn btn-outline-secondary mt-3">Continue shopping</a>
  </div>
</div>
{% endblock %}
